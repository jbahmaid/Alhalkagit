<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>سند: نموذج تفاعلي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Tokens: mirror docs/design/tokens.json */
:root{
  --bg:#F6F5F1;--surface:#FFFFFF;--surface-2:#EFEDE6;--border:#D9D6CC;
  --text:#1B2421;--text-muted:#56615C;
  --primary:#0E5E58;--primary-hover:#0A4A45;--primary-soft:#E2F0EE;--on-primary:#FFFFFF;
  --accent:#9A6212;--accent-soft:#F6ECDC;
  --match:#156A3A;--match-soft:#E3F3E8;--near:#8A4B00;--near-soft:#FBEFD9;
  --danger:#B42318;--danger-soft:#FDECEA;--info:#1F5C99;--info-soft:#E6EFF8;--focus:#0B66C3;
  --r-sm:6px;--r-md:10px;--r-lg:14px;--r-xl:20px;
  --sh-sm:0 1px 2px rgba(16,24,22,.06);--sh-md:0 4px 16px rgba(16,24,22,.08);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0E1412;--surface:#161F1C;--surface-2:#1E2926;--border:#2D3A36;
    --text:#E6ECE9;--text-muted:#A2B0AA;
    --primary:#5CC2B6;--primary-hover:#7AD3C8;--primary-soft:#15332F;--on-primary:#06201D;
    --accent:#E0B062;--accent-soft:#33281A;
    --match:#7BD49C;--match-soft:#133222;--near:#F2B766;--near-soft:#3A2A12;
    --danger:#FF8A80;--danger-soft:#3A1714;--info:#8DBBEE;--info-soft:#142638;--focus:#7DB3FF;
    --sh-sm:none;--sh-md:0 4px 20px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;font-size:16px;line-height:1.7;background:var(--bg);color:var(--text)}
h1,h2,h3{line-height:1.35;margin:0 0 8px;font-weight:700}
h1{font-size:24px}h2{font-size:20px}h3{font-size:17px;font-weight:600}
@media (min-width:768px){h1{font-size:30px}}
p{margin:0 0 12px}
a{color:var(--primary)}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
[dir=rtl] .flip{transform:scaleX(-1)}
[dir=ltr] .flip-back{transform:scaleX(-1)}
[tabindex="-1"]:focus{outline:none}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip{position:absolute;inset-inline-start:8px;top:-60px;background:var(--primary);color:var(--on-primary);padding:10px 16px;border-radius:var(--r-md);z-index:50}
.skip:focus{top:8px}
.container{max-width:1120px;margin-inline:auto;padding-inline:16px}
@media (min-width:768px){.container{padding-inline:24px}}
.narrow{max-width:640px;margin-inline:auto}

/* Prototype toolbar (not part of the product) */
.proto{background:var(--surface-2);border-bottom:1px dashed var(--border);font-size:14px}
.proto .container{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding-block:8px}
.proto-tag{font-weight:600;color:var(--accent);display:flex;align-items:center;gap:6px}
.seg{display:flex;flex:1 1 280px;border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden;background:var(--surface)}
.seg button{flex:1;min-height:44px;border:0;background:transparent;color:var(--text);font:inherit;font-size:14px;font-weight:500;cursor:pointer;padding:4px 6px}
.seg button+button{border-inline-start:1px solid var(--border)}
.seg button[aria-pressed=true]{background:var(--primary);color:var(--on-primary)}
.proto-screen{flex:1 1 240px;display:flex;align-items:center;gap:8px;min-width:0}
.proto-screen select{flex:1;min-width:0;min-height:44px}

/* App header */
.app-h{background:var(--surface);border-bottom:1px solid var(--border)}
.app-h .row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:64px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text);font-weight:700;font-size:20px;background:none;border:0;padding:0;font-family:inherit;cursor:pointer;min-height:44px;text-align:start}
.brand small{display:block;font-size:12px;font-weight:400;color:var(--text-muted);line-height:1.3}
@media (max-width:479px){.brand small{display:none}}
.nav{display:flex;flex-wrap:wrap;gap:4px;padding-bottom:8px}
@media (min-width:900px){.app-h .row{flex-wrap:nowrap}.nav{padding-bottom:0}}
.nav button{min-height:44px;padding:6px 12px;border:0;border-radius:var(--r-md);background:transparent;color:var(--text-muted);font:inherit;font-size:15px;font-weight:500;cursor:pointer}
.nav button:hover{background:var(--surface-2);color:var(--text)}
.nav button[aria-current=page]{background:var(--primary-soft);color:var(--primary);font-weight:600}
.h-actions{display:flex;gap:8px;align-items:center}

main{padding-block:24px 64px}
.page-head{margin-bottom:20px}
.page-head p{color:var(--text-muted)}
.eyebrow{font-size:13px;font-weight:600;color:var(--accent);margin-bottom:4px;display:block}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:9px 18px;border-radius:var(--r-md);border:1px solid transparent;font:inherit;font-size:15px;font-weight:600;cursor:pointer;text-decoration:none;line-height:1.3;text-align:center}
.btn-primary{background:var(--primary);color:var(--on-primary)}
.btn-primary:hover{background:var(--primary-hover)}
.btn-secondary{background:var(--surface);color:var(--text);border-color:var(--border)}
.btn-secondary:hover{background:var(--surface-2)}
.btn-ghost{background:transparent;color:var(--primary);padding-inline:10px}
.btn-ghost:hover{background:var(--primary-soft)}
.btn-danger{background:var(--danger);color:#fff}
@media (prefers-color-scheme:dark){.btn-danger{color:#2A0B08}}
.btn[disabled],.btn[aria-disabled=true]{opacity:.55;cursor:not-allowed}
.btn-block{width:100%}
.btn-sm{min-height:44px;padding:6px 12px;font-size:14px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.actions.between{justify-content:space-between}

/* Forms */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px;min-width:0}
label,legend{font-weight:500;font-size:15px}
.opt{font-weight:400;color:var(--text-muted);font-size:13px}
.hint{font-size:13px;color:var(--text-muted);margin:0}
input[type=text],input[type=email],input[type=tel],input[type=password],input[type=number],input[type=date],input[type=month],input[type=search],select,textarea{
  width:100%;min-height:44px;padding:9px 12px;font:inherit;font-size:16px;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md)}
input::placeholder,textarea::placeholder{color:var(--text-muted);opacity:1}
input:focus-visible,select:focus-visible,textarea:focus-visible{border-color:var(--focus)}
input:user-invalid,select:user-invalid{border-color:var(--danger)}
textarea{min-height:140px;resize:vertical}
.ltr{direction:ltr;text-align:start}
[dir=rtl] .ltr{text-align:right}
fieldset{border:0;padding:0;margin:0 0 16px;min-width:0}
fieldset.group{border:1px solid var(--border);border-radius:var(--r-lg);padding:12px 16px 4px;background:var(--surface)}
fieldset.group>legend{padding-inline:6px}
legend{margin-bottom:6px}
.choices{display:flex;flex-wrap:wrap;gap:8px}
.choice{display:flex;align-items:center;gap:10px;flex:1 1 130px;min-height:44px;padding:8px 14px;border:1px solid var(--border);border-radius:var(--r-md);background:var(--surface);cursor:pointer;font-weight:500}
.choice:has(input:checked){border-color:var(--primary);background:var(--primary-soft)}
.choice:has(input:focus-visible){outline:2px solid var(--focus);outline-offset:2px}
input[type=radio],input[type=checkbox]{width:20px;height:20px;margin:0;accent-color:var(--primary);flex:none}
.check{display:flex;gap:10px;align-items:flex-start;min-height:44px;padding-block:10px;cursor:pointer}
.check input{margin-top:3px}
.grid-2{display:grid;gap:0 16px}
@media (min-width:640px){.grid-2{grid-template-columns:1fr 1fr}}
.age-out{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--text-muted)}
.age-out strong{color:var(--text)}
.otp{font-size:24px !important;letter-spacing:.4em;text-align:center !important;font-variant-numeric:tabular-nums;max-width:260px}

/* Cards & surfaces */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px;box-shadow:var(--sh-sm);min-width:0}
@media (min-width:768px){.card{padding:20px 24px}}
.card+.card{margin-top:16px}
.job-list>.card+.card,.how>.card+.card,.charts>.card+.card{margin-top:0}
.stack>*+*{margin-top:12px}
.note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:var(--r-md);font-size:14px;margin-bottom:16px;line-height:1.6}
.note p{margin:0}
.note.info{background:var(--info-soft);color:var(--info)}
.note.privacy{background:var(--primary-soft);color:var(--primary)}
.note.warn{background:var(--near-soft);color:var(--near)}
.note .i{margin-top:2px}

/* Badges */
.badge{display:inline-flex;align-items:center;gap:6px;min-height:28px;padding:2px 10px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap;line-height:1.4}
.badge svg.i{width:16px;height:16px;stroke-width:2.5}
.badge.match{background:var(--match-soft);color:var(--match)}
.badge.near{background:var(--near-soft);color:var(--near)}
.badge.info{background:var(--info-soft);color:var(--info)}
.badge.muted{background:var(--surface-2);color:var(--text-muted)}
.badge.danger{background:var(--danger-soft);color:var(--danger)}
.badge.primary{background:var(--primary-soft);color:var(--primary)}
.badge .score{font-weight:500;opacity:.9}
.badges{display:flex;flex-wrap:wrap;gap:6px;align-items:center}

/* Job cards */
.job-list{display:grid;gap:12px}
@media (min-width:900px){.job-list{grid-template-columns:1fr 1fr}}
.job{display:flex;flex-direction:column;gap:10px}
.job-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;flex-wrap:wrap}
.job h2{font-size:18px;margin:0}
.meta{display:flex;flex-wrap:wrap;gap:6px 16px;list-style:none;padding:0;margin:0;font-size:14px;color:var(--text-muted)}
.meta li{display:flex;align-items:center;gap:6px}
.meta svg.i{width:18px;height:18px}
.job-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;border-top:1px solid var(--border);padding-top:10px;margin-top:auto}
.legend-line{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:13px;color:var(--text-muted);align-items:center;margin-bottom:12px}
.filters{display:grid;gap:0 12px;margin-bottom:8px}
@media (min-width:768px){.filters{grid-template-columns:2fr 1fr 1fr}}
@media (min-width:768px){.filters.f5{grid-template-columns:1.4fr 1fr 1fr 1fr 1fr}}

/* Stepper */
.stepper-mobile{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:14px;margin-bottom:6px}
.progress{height:6px;border-radius:999px;background:var(--surface-2);overflow:hidden;margin-bottom:16px}
.progress span{display:block;height:100%;background:var(--primary);border-radius:999px}
.steps{display:none;list-style:none;padding:0;margin:0 0 20px;gap:6px}
.steps li{flex:1;font-size:13px;color:var(--text-muted);display:flex;align-items:center;gap:6px;padding-top:8px;border-top:3px solid var(--border)}
.steps li.done{color:var(--text);border-color:var(--primary)}
.steps li[aria-current=step]{color:var(--primary);font-weight:600;border-color:var(--primary)}
@media (min-width:768px){.steps{display:flex}}
.save-state{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--match);margin:0}
.save-state .i{width:16px;height:16px}

/* Upload */
.drop{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;border:2px dashed var(--border);border-radius:var(--r-lg);padding:24px 16px;background:var(--surface);cursor:pointer}
.drop:hover{border-color:var(--primary)}
.drop:focus-within{outline:2px solid var(--focus);outline-offset:2px}
.drop .i{width:32px;height:32px;color:var(--primary)}
.file-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.file-row .name{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:6px;list-style:none;padding:0;margin:0}
.chips li{padding:4px 10px;border-radius:999px;background:var(--surface-2);font-size:13px}
.analysis{border-color:var(--info);border-style:dashed;margin-top:16px}
ol.tips{margin:0;padding-inline-start:20px}
ol.tips li{margin-bottom:6px}

/* Definition lists */
dl.kv{display:grid;grid-template-columns:minmax(110px,40%) 1fr;gap:8px 12px;margin:0;font-size:15px}
dl.kv dt{color:var(--text-muted)}
dl.kv dd{margin:0;font-weight:500;overflow-wrap:anywhere;min-width:0}
.section-title{display:flex;align-items:center;gap:8px;margin:0 0 12px;font-size:17px}
.why{list-style:none;padding:0;margin:0}
.why li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--border)}
.why li:last-child{border-bottom:0}
.why .ok{color:var(--match)}.why .no{color:var(--near)}
.two-col{display:grid;gap:16px}
@media (min-width:900px){.two-col{grid-template-columns:2fr 1fr;align-items:start}.two-col .sticky{position:sticky;top:16px}}
.two-col>*+*{margin-top:0}
.two-col .card+.card{margin-top:16px}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:20px}
@media (min-width:768px){.stats{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px 16px}
.stat .n{font-size:26px;font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums}
.stat .l{font-size:13px;color:var(--text-muted)}

/* Responsive table: table on desktop, cards on mobile */
.rtable{width:100%;border-collapse:collapse;font-size:15px}
.rtable th{font-size:13px;color:var(--text-muted);font-weight:600;text-align:start;padding:10px 12px;border-bottom:1px solid var(--border);background:var(--surface-2)}
.rtable td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle;overflow-wrap:anywhere}
.rtable tr:last-child td{border-bottom:0}
.table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);overflow-x:auto}
@media (max-width:767px){
  .rtable thead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
  .rtable,.rtable tbody,.rtable tr,.rtable td{display:block;width:100%}
  .rtable tr{padding:8px 0;border-bottom:1px solid var(--border)}
  .rtable tr:last-child{border-bottom:0}
  .rtable td{display:flex;justify-content:space-between;align-items:center;gap:12px;border:0;padding:6px 14px;text-align:end}
  .rtable td::before{content:attr(data-label);font-size:13px;font-weight:600;color:var(--text-muted);text-align:start;flex:none;max-width:45%}
  .rtable td.full{display:block;text-align:start}
  .rtable td.full::before{display:block;margin-bottom:4px}
}
.row-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
details.diff summary{cursor:pointer;min-height:44px;display:flex;align-items:center;color:var(--primary);font-weight:500}
details.diff pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;background:var(--surface-2);padding:8px 10px;border-radius:var(--r-sm);margin:4px 0;direction:ltr;text-align:left}

/* Tabs */
[role=tablist]{display:flex;flex-wrap:wrap;gap:4px;border-bottom:1px solid var(--border);margin-bottom:16px}
[role=tab]{min-height:44px;padding:8px 14px;border:0;border-bottom:3px solid transparent;background:none;font:inherit;font-weight:500;color:var(--text-muted);cursor:pointer;margin-bottom:-1px}
[role=tab][aria-selected=true]{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}

/* Charts */
.chart{margin:0}
.chart figcaption{font-weight:600;margin-bottom:10px}
.bar-row{margin-bottom:10px}
.bar-label{display:flex;justify-content:space-between;gap:8px;font-size:14px;margin-bottom:2px}
.bar-label .v{font-variant-numeric:tabular-nums;font-weight:600}
.bar-row svg{display:block;width:100%;height:14px}
.bar-row.hidden .v{color:var(--text-muted);font-weight:500;font-size:13px}
.charts{display:grid;gap:16px}
@media (min-width:900px){.charts{grid-template-columns:1fr 1fr}}

/* Landing */
.hero{padding:16px 0 8px}
.hero h1{font-size:30px;max-width:22ch}
@media (min-width:768px){.hero h1{font-size:40px}}
.hero p.lead{font-size:18px;color:var(--text-muted);max-width:52ch}
.how{display:grid;gap:12px;list-style:none;padding:0;margin:24px 0;counter-reset:how}
@media (min-width:768px){.how{grid-template-columns:repeat(3,1fr)}}
.how li{counter-increment:how}
.how li::before{content:counter(how);display:inline-grid;place-items:center;width:32px;height:32px;border-radius:999px;background:var(--primary-soft);color:var(--primary);font-weight:700;margin-bottom:8px}
.timeline{list-style:none;padding:0;margin:0 0 16px}
.timeline li{display:flex;gap:12px;align-items:center;padding:10px 0}
.timeline .dot{width:32px;height:32px;border-radius:999px;display:grid;place-items:center;flex:none}
.timeline .done .dot{background:var(--match-soft);color:var(--match)}
.timeline .wait .dot{background:var(--near-soft);color:var(--near)}
.empty{text-align:center;padding:32px 16px;color:var(--text-muted)}
.empty .i{width:36px;height:36px}
.muted{color:var(--text-muted)}
.small{font-size:14px}

/* Dialog & toast */
dialog{border:0;border-radius:var(--r-xl);padding:0;width:min(520px,calc(100vw - 32px));background:var(--surface);color:var(--text);box-shadow:var(--sh-md)}
dialog::backdrop{background:rgba(10,20,18,.5)}
.dlg-body{padding:20px}
.dlg-body h2{font-size:20px}
.dlg-foot{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;padding:12px 20px 20px}
.toast{position:fixed;inset-inline:16px;bottom:16px;margin-inline:auto;max-width:480px;background:var(--text);color:var(--bg);padding:12px 16px;border-radius:var(--r-md);display:flex;gap:10px;align-items:center;box-shadow:var(--sh-md);z-index:60;transform:translateY(150%);visibility:hidden;transition:transform .2s ease,visibility .2s}
.toast.show{transform:none;visibility:visible}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
footer.app-f{border-top:1px solid var(--border);padding-block:16px;font-size:13px;color:var(--text-muted)}
</style>
</head>
<body>
<a class="skip" href="#main" id="skip"></a>

<div class="proto" role="region" id="proto" aria-labelledby="proto-tag">
  <div class="container">
    <span class="proto-tag" id="proto-tag"></span>
    <div class="seg" role="group" id="role-seg" aria-labelledby="proto-tag"></div>
    <div class="proto-screen">
      <label for="screen-sel" id="screen-sel-l" class="small"></label>
      <select id="screen-sel"></select>
    </div>
  </div>
</div>

<header class="app-h" id="app-h"></header>
<main id="main" tabindex="-1"><div class="container" id="view"></div></main>
<footer class="app-f"><div class="container" id="foot"></div></footer>

<dialog id="dlg" aria-labelledby="dlg-title"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ======================= Dictionary (Arabic, English) ======================= */
const T = {
  pageTitle:['سند: نموذج تفاعلي','Sanad: interactive prototype'],
  brand:['سَنَد','Sanad'],
  tagline:['نصل كفاءات أبنائنا بالفرص',"Connecting our people's talent with opportunity"],
  skip:['تخطَّ إلى المحتوى','Skip to content'],
  protoTag:['نموذج تفاعلي · بيانات وهمية','Prototype · sample data'],
  screen:['الشاشة','Screen'],
  roleSeeker:['الباحث عن عمل','Job seeker'], roleEmployer:['صاحب العمل','Employer'], roleAdmin:['مدير النظام','Admin'],
  langBtn:['English','العربية'], langAria:['التبديل إلى الإنجليزية','التبديل إلى العربية · Switch to Arabic'],
  mainNav:['التنقل الرئيسي','Main navigation'],

const fmtDate=iso=>{if(!iso)return '';const [y,m,dd]=iso.split('-').map(Number);const d=new Date(y,m-1,dd||1);const o=iso.length===7?{month:'short',year:'numeric'}:{day:'numeric',month:'short',year:'numeric'};return new Intl.DateTimeFormat(S.lang==='ar'?'ar-u-ca-gregory-nu-latn':'en-GB',o).format(d);};
const num=n=>new Intl.NumberFormat(S.lang==='ar'?'ar-u-nu-latn':'en').format(n);
function getPath(o,p){return p.split('.').reduce((a,k)=>a==null?a:a[k],o);}
function setPath(o,p,v){const k=p.split('.');let a=o;for(let i=0;i<k.length-1;i++)a=a[k[i]];a[k[k.length-1]]=v;}
const val=p=>esc(L(getPath(S.p,p)));
function ageFrom(iso){if(!iso)return null;const b=new Date(iso),n=new Date();let a=n.getFullYear()-b.getFullYear();const m=n.getMonth()-b.getMonth();if(m<0||(m===0&&n.getDate()<b.getDate()))a--;return a>=0&&a<120?a:null;}

const countryOpts=()=>Object.keys(COUNTRIES).map(c=>[c,L(COUNTRIES[c])]);

function field({id,label,bind,type='text',req=true,hint,attrs='',value,cls=''}){

  return `<div class="field"><label for="${id}">${label}${req?'':` <span class="opt">(${t('optional')})</span>`}</label>
  ${hint?`<p class="hint" id="${id}-h">${hint}</p>`:''}
  <input id="${id}" name="${id}" type="${type}" class="${cls}" ${bind?`data-bind="${bind}"`:''} value="${v}" ${req?'required':''} ${hint?`aria-describedby="${id}-h"`:''} ${attrs}></div>`;
}
function selectField({id,label,bind,options,req=true,hint,value,attrs=''}){
  const cur=value!==undefined?value:(bind?String(getPath(S.p,bind)??''):'');
  return `<div class="field"><label for="${id}">${label}${req?'':` <span class="opt">(${t('optional')})</span>`}</label>
  ${hint?`<p class="hint" id="${id}-h">${hint}</p>`:''}
  <select id="${id}" name="${id}" ${bind?`data-bind="${bind}"`:''} ${req?'required':''} ${hint?`aria-describedby="${id}-h"`:''} ${attrs}>
  <option value="">${t('choose')}</option>${options.map(o=>`<option value="${esc(o[0])}" ${String(o[0])===cur?'selected':''}>${esc(o[1])}</option>`).join('')}</select></div>`;
}
function choices({name,legend,bind,options,rerender=false,value}){
  const cur=value!==undefined?value:getPath(S.p,bind);
  return `<fieldset><legend>${legend}</legend><div class="choices">${options.map(([v,l])=>`<label class="choice"><input type="radio" id="${name}-${v}" name="${name}" value="${v}" ${bind?`data-bind="${bind}"`:''} ${rerender?'data-rerender="1"':''} ${String(cur)===String(v)?'checked':''} required> ${l}</label>`).join('')}</div></fieldset>`;
}
function matchBadge(score){

  return '';
}

  const desc=rows.map(r=>`${r[0]}: ${r[1]>=5?num(r[1]):t('hiddenLt5')}`).join('، ');
  return `<figure class="chart card" role="group" aria-label="${esc(title)}"><figcaption>${title}</figcaption><p class="sr-only">${esc(desc)}</p>
  ${rows.map(([l,v])=>{const hidden=v<5;const w=hidden?100:Math.max(2,v/max*100);const x=rtl?100-w:0;return `<div class="bar-row ${hidden?'hidden':''}" aria-hidden="true">
    <div class="bar-label"><span>${esc(l)}</span><span class="v">${hidden?t('hiddenLt5'):num(v)}</span></div>
    <svg viewBox="0 0 100 14" preserveAspectRatio="none" focusable="false"><rect x="0" y="0" width="100" height="14" rx="1.5" fill="var(--surface-2)"/>${hidden?`<rect x="0.5" y="0.5" width="99" height="13" fill="none" stroke="var(--border)" stroke-dasharray="2 1.5" vector-effect="non-scaling-stroke"/>`:`<rect x="${x}" y="0" width="${w}" height="14" rx="1.5" fill="${color}"/>`}</svg></div>`;}).join('')}</figure>`;}
V['S-22']=()=>{const emp=S.role==='employer';const js=myJobs();
  return `${pageHead(t('reportsTitle'),emp?t('empReportsNote'):t('reportsLead'))}${note('info','shield',t('under5'))}${emp?'':exportBtn()}
  ${emp?`<h2>${t('myJobsStats')}</h2><div class="stats"><div class="stat"><div class="n">${js.length}</div><div class="l">${t('totalJobs')}</div></div><div class="stat"><div class="n">${js.filter(j=>j.status==='open').length}</div><div class="l">${t('openJobs')}</div></div><div class="stat"><div class="n">${js.reduce((s,j)=>s+(APPS[j.id]||[]).length,0)}</div><div class="l">${t('interestReqs')}</div></div><div class="stat"><div class="n">${js.filter(j=>j.outcome==='hired').length}</div><div class="l">${t('hiredVia')}</div></div></div>`:''}
  <h2>${t('seekerStats')}</h2><div class="stats"><div class="stat"><div class="n">${num(1248)}</div><div class="l">${t('totalSeekers')}</div></div><div class="stat"><div class="n">${num(733)}</div><div class="l">${t('withExp')}</div></div></div>
  <div class="charts">
    ${bars(t('byAge'),[['18–24',312],['25–34',541],['35–44',268],['45–54',98],['55+',29]])}
    ${bars(t('byGender'),[[t('male'),702],[t('female'),546]])}
    ${bars(t('byEdu'),LK.edu.map((e,i)=>[L([e[0],e[1]]),[214,287,598,146,3][i]]))}
    ${bars(t('byExp'),[[t('withExp'),733],[t('withoutExp'),515]])}
  </div>
  <h2 style="margin-top:24px">${t('jobStats')}</h2><div class="stats"><div class="stat"><div class="n">96</div><div class="l">${t('totalJobs')}</div></div><div class="stat"><div class="n">41</div><div class="l">${t('openJobs')}</div></div><div class="stat"><div class="n">38</div><div class="l">${t('hiredVia')}</div></div><div class="stat"><div class="n">17</div><div class="l">${t('outNone')}</div></div></div>
  <div class="charts">
    ${bars(t('bySector'),LK.sector.map((s,i)=>[L([s[0],s[1]]),[31,14,9,12,11,8,9,2][i]]))}
    ${bars(t('byStatus'),[[t('stOpen'),41],[t('outHired'),38],[t('outNone'),17]],'var(--accent)')}
  </div>`;};

/* ======================= Chrome: toolbar, header ======================= */
const NAV={
  seeker:[['S-07','navJobs'],['S-09','navReq'],['S-05','navProfile']],
  employer:[['S-12','navDash'],['S-13','navPost'],['S-22','navReports']],
  admin:[['S-17','navHome'],['S-18','navApprovals'],['S-19','navLookups'],['S-20','navUsers'],['S-21','navAudit'],['S-22','navReports']],
};
const PUBLIC=['S-01','S-02','S-03','S-04','S-10','S-11'];
function renderChrome(){
  document.documentElement.lang=S.lang;document.documentElement.dir=S.lang==='ar'?'rtl':'ltr';document.title=t('pageTitle');
  $('#skip').textContent=t('skip');
  $('#proto-tag').innerHTML=`${icon('info')}${t('protoTag')}`;
  $('#role-seg').innerHTML=['seeker','employer','admin'].map(r=>`<button type="button" aria-pressed="${S.role===r}" data-role-switch="${r}">${roleName(r)}</button>`).join('');
  $('#screen-sel-l').textContent=t('screen');
  $('#screen-sel').innerHTML=ROLE_SCREENS[S.role].map(id=>`<option value="${id}" ${id===S.screen?'selected':''}>${id} · ${t(id)}</option>`).join('');
  const pub=PUBLIC.includes(S.screen);const nav=pub?[]:NAV[S.role];
  const active=S.screen==='S-06'?'S-05':S.screen==='S-08'?'S-07':['S-14','S-15','S-16'].includes(S.screen)?'S-12':S.screen;
  $('#app-h').innerHTML=`<div class="container"><div class="row">
    <button class="brand" data-go="${pub?'S-01':ROLE_HOME[S.role]==='S-01'?'S-07':ROLE_HOME[S.role]}">${LOGO}<span>${t('brand')}<small>${t('tagline')}</small></span></button>
    <div class="h-actions"><button class="btn btn-secondary btn-sm" id="lang-btn" data-act="lang" lang="${S.lang==='ar'?'en':'ar'}" aria-label="${t('langAria')}">${t('langBtn')}</button>
    ${pub?(S.screen==='S-11'?`<button class="btn btn-ghost btn-sm" data-go="S-01">${t('logout')}</button>`:S.screen!=='S-02'?`<button class="btn btn-ghost btn-sm" data-go="S-02">${t('login')}</button>`:''):`<button class="btn btn-ghost btn-sm" data-go="${S.role==='seeker'?'S-01':'S-02'}">${t('logout')}</button>`}</div></div>
    ${nav.length?`<nav class="nav" aria-label="${t('mainNav')}">${nav.map(([id,k])=>`<button data-go="${id}" ${id===active?'aria-current="page"':''}>${t(k)}</button>`).join('')}</nav>`:''}</div>`;
  $('#foot').textContent=t('footer');
}
function render(){renderChrome();$('#view').innerHTML=V[S.screen]();}
function go(screen,opts={}){
  if(screen==='S-06')S.step=6;else if(screen==='S-05'&&(S.screen!=='S-05'||opts.reset))S.step=S.step===6?1:S.step;
  Object.assign(S,opts);S.screen=screen;render();window.scrollTo(0,0);
  const h=$('#view h1');if(h)h.focus({preventScroll:true});
  if(screen==='S-04'&&!resendLeft)startResend();
}
function rerenderKeep(){const id=document.activeElement&&document.activeElement.id;render();if(id){const el=document.getElementById(id);if(el)el.focus();}}
function toast(msg){const el=$('#toast');el.innerHTML=`${icon('check')}<span>${msg}</span>`;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),4200);}
function startResend(){resendLeft=45;clearInterval(resendTimer);resendTimer=setInterval(()=>{resendLeft--;const b=$('#resend');if(b){b.disabled=resendLeft>0;b.textContent=resendLeft>0?`${t('resendIn')} 0:${String(resendLeft).padStart(2,'0')}`:t('resend');}if(resendLeft<=0)clearInterval(resendTimer);},1000);}

/* Dialog */
function openDialog({title,body,confirm,danger,gate,onConfirm}){
  const d=$('#dlg');const opener=document.activeElement;
  d.innerHTML=`<form method="dialog"><div class="dlg-body"><h2 id="dlg-title">${title}</h2>${body}</div><div class="dlg-foot"><button value="cancel" formnovalidate class="btn btn-secondary">${t('cancel')}</button><button value="ok" id="dlg-ok" class="btn ${danger?'btn-danger':'btn-primary'}" ${gate?'disabled':''}>${confirm}</button></div></form>`;
  if(gate){const g=d.querySelector(gate);g.addEventListener('change',()=>{d.querySelector('#dlg-ok').disabled=!g.checked;});}
  d.onclose=()=>{if(d.returnValue==='ok'){onConfirm(d);}else if(opener&&document.contains(opener))opener.focus();};
  d.returnValue='';d.showModal();
}

/* ======================= Actions ======================= */
const SUBMIT={
  login(){go(ROLE_HOME[S.role]==='S-01'?'S-07':ROLE_HOME[S.role]);},
  seekerSignup(f){S.newEmail=f.querySelector('#su-email').value;go('S-04',{verifyFor:'seeker'});},
  verify(){if(S.verifyFor==='employer'){go('S-11');}else{S.step=1;go('S-05');}},
  wizNext(){if(S.step<6){S.step++;go(S.step===6?'S-06':'S-05');}else{toast(t('doneToast'));go('S-07');}},
  empSignup(){S.empApproved=false;go('S-04',{verifyFor:'employer'});},
  postJob(f){const g=id=>f.querySelector(id).value;const id=Math.max(...JOBS.map(j=>j.id))+1;
    JOBS.push({id,owner:'e1',title:[g('#pj-title'),g('#pj-title')],sector:+g('#pj-sec'),city:[g('#pj-city'),g('#pj-city')],country:g('#pj-country'),edu:+g('#pj-edu'),years:+g('#pj-years')||0,posted:new Date().toISOString().slice(0,10),score:0,status:'open',why:[0,0,0],desc:[g('#pj-desc'),g('#pj-desc')],reqs:[]});
    toast(t('publishedToast'));go('S-12');},
  closeJob(f){const j=curJob();j.status='closed';j.outcome=S.closeOutcome==='none'?'none':'hired';if(j.outcome==='hired')j.hired=f.querySelector('#cj-who').value;toast(t('closedToast'));S.closeOutcome='hired';S.closeWho='';go('S-12');},
  addLookup(f){const ar=f.querySelector('#lk-ar').value.trim(),en=f.querySelector('#lk-en').value.trim();LK[S.lookupTab].push([ar,en,1]);toast(t('addedToast'));render();$('#lk-ar').focus();},
};
const ACT={
  posAdd(){S.p.pos.push({t:['',''],f:'',to:''});render();const el=$(`#w-p${S.p.pos.length-1}t`);if(el)el.focus();},
  posRemove(a){S.p.pos.splice(+a.dataset.i,1);render();},
  lang(){S.lang=S.lang==='ar'?'en':'ar';render();$('#lang-btn').focus();},
  wizBack(){S.step--;go('S-05');},
  wizLater(){toast(t('laterToast'));go('S-07');},
  resend(){toast(t('codeSent'));startResend();},
  cvRemove(){S.p.cv=null;render();$('#cv-in').focus();},
  cvReplace(){$('#cv-in').click();},
  interest(el){const id=+el.dataset.job;openDialog({title:t('dlgInterestTitle'),confirm:t('sendRequest'),gate:'#agree',
    body:`<p>${t('dlgInterestLead')}</p><ul><li>${t('shareProfile')}</li><li>${t('shareCv')}</li><li>${t('shareContact')}</li></ul>${note('privacy','shield',t('dlgInterestNote'))}<label class="check"><input type="checkbox" id="agree"> <span>${t('agreeShare')}</span></label>`,
    onConfirm(){S.myReqs.unshift({job:id,d:new Date().toISOString().slice(0,10)});render();toast(t('interestToast'));const h=$('#view h1');h&&h.focus();}});},
  simApprove(){S.empApproved=true;toast(t('approvedToast'));go('S-12');},
  noop(){},
  exportXlsx(){openDialog({title:t('exportTitle'),confirm:t('exportXlsx'),body:`<p>${t('exportBody')}</p>${field({id:'ex-pw',label:t('password'),type:'password',value:'',attrs:'autocomplete="current-password"'})}`,onConfirm(){toast(t('exportToast'));}});},
  openCv(el,e){e.preventDefault();toast(t('cvLinkHint'));},
  approve(el){const p=PENDING.find(x=>x.id===el.dataset.id);PENDING=PENDING.filter(x=>x!==p);render();toast(t('approvedA'));$('#view h1').focus();},
  reject(el){const id=el.dataset.id;const p=PENDING.find(x=>x.id===id);openDialog({title:t('rejectTitle'),confirm:t('reject'),danger:true,
    body:`<p><strong>${esc(L(p.org))}</strong></p><div class="field"><label for="rj">${t('rejectReason')} <span class="opt">(${t('optional')})</span></label><p class="hint" id="rj-h">${t('rejectHint')}</p><textarea id="rj" aria-describedby="rj-h" style="min-height:90px"></textarea></div>`,
    onConfirm(){PENDING=PENDING.filter(x=>x.id!==id);render();toast(t('rejectedA'));$('#view h1').focus();}});},
  tab(el){S.lookupTab=el.dataset.tab;render();$('#tab-'+S.lookupTab).focus();},
  toggleLookup(el){const x=LK[S.lookupTab][+el.dataset.i];x[2]=x[2]?0:1;rerenderKeep();toast(t('updatedToast'));},
  editLookup(el){const i=+el.dataset.i;const x=LK[S.lookupTab][i];openDialog({title:t('editItem'),confirm:t('save'),
    body:`${field({id:'ed-ar',label:t('nameAr'),value:x[0],attrs:'dir="rtl" lang="ar"'})}${field({id:'ed-en',label:t('nameEn'),value:x[1],attrs:'dir="ltr" lang="en"'})}`,
    onConfirm(d){x[0]=d.querySelector('#ed-ar').value;x[1]=d.querySelector('#ed-en').value;render();toast(t('updatedToast'));}});},
};

/* ======================= Event wiring ======================= */
document.addEventListener('click',e=>{
  const rs=e.target.closest('[data-role-switch]');
  if(rs){S.role=rs.dataset.roleSwitch;go(ROLE_HOME[S.role]);return;}
  const g=e.target.closest('[data-go]');
  if(g){e.preventDefault();const o={};if(g.dataset.job)o.jobId=+g.dataset.job;if(g.dataset.seeker)o.seekerId=g.dataset.seeker;if(g.dataset.role)o.role=g.dataset.role;
    if(g.dataset.go==='S-05')o.reset=true;if(g.dataset.go==='S-16'){S.closeOutcome='hired';S.closeWho='';}go(g.dataset.go,o);return;}
  const a=e.target.closest('[data-act]');
  if(a&&ACT[a.dataset.act]){ACT[a.dataset.act](a,e);}
});
document.addEventListener('submit',e=>{
  const f=e.target.closest('form[data-submit]');if(!f)return;e.preventDefault();
  if(!f.reportValidity())return;SUBMIT[f.dataset.submit](f);
});
let saveT;
function markSaving(){const s=$('#save-state');if(!s)return;s.innerHTML=`${icon('clock')}<span>${t('saving')}</span>`;clearTimeout(saveT);saveT=setTimeout(()=>{const s2=$('#save-state');if(s2)s2.innerHTML=`${icon('check')}<span>${t('saved')}</span>`;},700);}
function onField(e){
  const el=e.target;
  if(el.dataset.bind){const v=el.type==='checkbox'?el.checked:el.value;setPath(S.p,el.dataset.bind,v);markSaving();
    if(el.dataset.bind==='birth'){const a=ageFrom(v);const out=$('#age-val');if(out)out.textContent=a??'—';}
    if(el.dataset.rerender&&e.type==='change')rerenderKeep();}
  if(el.name==='outcome'&&e.type==='change'){S.closeOutcome=el.value;rerenderKeep();}
  if(el.id==='cj-who')S.closeWho=el.value;
  if(el.dataset.filter){const v=el.type==='checkbox'?el.checked:el.value;setPath(S,el.dataset.filter,v);
    const box=$('#job-results')?'job-results':$('#user-results')?'user-results':'audit-results';
    const fn={'job-results':jobResults,'user-results':userResults,'audit-results':auditResults}[box];document.getElementById(box).innerHTML=fn();}
  if(el.dataset.actChange==='cvPick'&&e.type==='change'&&el.files&&el.files[0]){const f=el.files[0];
    S.p.cv={name:f.name,size:f.size>1e6?(f.size/1e6).toFixed(1)+' MB':Math.max(1,Math.round(f.size/1e3))+' KB'};markSaving();rerenderKeep();}
}
document.addEventListener('input',onField);
document.addEventListener('change',onField);
/* Tabs: arrow-key navigation */
document.addEventListener('keydown',e=>{
  const tab=e.target.closest('[role=tab]');if(!tab)return;
  const keys=S.lang==='ar'?{ArrowLeft:1,ArrowRight:-1}:{ArrowLeft:-1,ArrowRight:1};if(!(e.key in keys))return;e.preventDefault();
  const i=TABS.findIndex(x=>x[0]===S.lookupTab);const n=(i+keys[e.key]+TABS.length)%TABS.length;S.lookupTab=TABS[n][0];render();$('#tab-'+S.lookupTab).focus();
});
$('#screen-sel').addEventListener('change',e=>{const id=e.target.value;if(id==='S-04')S.verifyFor=S.role==='employer'?'employer':'seeker';go(id,id==='S-05'?{reset:true}:{});$('#screen-sel').focus();});

S.closeOutcome='hired';
render();
</script>
</body>
</html>
